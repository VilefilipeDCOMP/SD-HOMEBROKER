spring.application.name=simulador-bolsa
server.port=8086
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5500}

# === PostgreSQL ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/simulador_bolsa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:simulador}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# === JWT ===
jwt.secret=${JWT_SECRET:31UyOPbMwIsW1falxudyzfpCis2zVz49EoxHY7KW9xo}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# === Mercado ===
market.initial-balance=${MARKET_INITIAL_BALANCE:10000.00}